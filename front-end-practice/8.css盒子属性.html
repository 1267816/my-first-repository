<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css盒子模型</title>
    <style>
        .border-demo {
            background-color: yellow;
            width: 300px;
            height: 200px;
            border-style: solid;
            border-width: 0 0 0 10px;/*顺序：上右下左*/
            border-color: brown;
        }
        .demo {
            background-color: aqua;
            display: inline-block;
            border: 5px solid yellowgreen;
            padding: 50px;
            margin: 40px;
        }
    </style>
</head>

<body>
  <div class="demo">B 站搜索罗大富</div>  
  <div class="border-demo">这是一个边框示例</div>
</body>

</html>
