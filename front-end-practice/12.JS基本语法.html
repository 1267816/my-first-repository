    <script>

    console.log(name)

    let age = 9;

    if (age > 18) {
        console.log('你已经成年了');

    }

    console.log('FOR循环')
    for (let i = 1; i<=10; i++) {
        console.log(i);
    }

    console.log('while循环');
    let count = 1;
    while (count <= 10) {
        console.log(count);
        count = count + 1;
    }

    console.log('循环关键字')
    for (var i = 0; i < 5; i++) {
        if (i == 2) {
            continue;
        }
        if (i == 4) {
            break;
        }
        console.log(i);
    }
